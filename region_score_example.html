<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKEA FairSource</title>
    <link rel="stylesheet" href="/css/style.css">
</head>


<body>
    <script src="backend-info/backend_retrieval.js"></script>
    <script>
        async function displayRegions() {
            const data = await getData();

            for (let i = 0; i < data.length; i++) {
                const region = data[i];

                const regionElement = document.createElement('div');
                regionElement.classList.add('region');

                const nameElement = document.createElement('h2');
                nameElement.textContent = region.region;

                const scoreElement = document.createElement('p');
                scoreElement.textContent = `Score: ${region.score}`;

                regionElement.appendChild(nameElement);
                regionElement.appendChild(scoreElement);

                document.body.appendChild(regionElement);
            }
        }

        displayRegions().catch(console.error);
    </script>
</body>
