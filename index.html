<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKEA FairSource</title>
    <link rel="stylesheet" href="/css/style.css">

    <!-- <script defer src=''></script> ///// inanför '' i src ska våran script ligga om vi vill ha det -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('[data-include]').forEach(async (el) => {
                const file = `includes/${el.dataset.include}.html`;
                const response = await fetch(file);
                if (response.ok) {
                    el.innerHTML = await response.text();
                } else {
                    console.error(`Could not load ${file}`);
                }
            });
        });
    </script>
</head>

<body>

<div data-include="header"></div>
<main class="main">
    <aside class="sidebar">
        <div class="search">
            <input type="text" placeholder="Search..." aria-label="Search">
        </div>
    </aside>

    <section class="hero">

        <div class="hero-content">

            <h1>
                <span>FairSource</span>
                <strong>
                    A healthy supply chain<br>
                    across the world
                </strong>
            </h1>

            <h1>My First Google Map</h1>

            <div id="googleMap" style="width:100%;height:400px;"></div>

            <script>
                function myMap() {
                    var mapProp= {
                        center:new google.maps.LatLng(31.253166,121.476629),
                        zoom:4.2,
                    };
                    var map = new google.maps.Map(document.getElementById("googleMap"),mapProp);
                }

                const circle = new google.maps.circle({
                    strokeColor: "#FF0000",       // Outline color
                    strokeOpacity: 0.8,           // Outline opacity
                    strokeWeight: 5,              // Outline thickness
                    fillColor: "#FF0000",         // Fill color
                    fillOpacity: 0.35,            // Fill opacity
                    map: myMap,                     // Attach to map
                    center: center,               // Circle center
                    radius: 75000
                });

                
            </script>

            <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4kDAmx2QiOjRfrg2_1Edr5PztkSDRkFA&callback=myMap"></script>


            <button class="arrow-button" aria-label="Start">
                <span></span>
            </button>
        </div>
    </section>
</main>

<div data-include="footer"></div>

</body>
</html>
